services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: easecoding
      MYSQL_USER: ease
      MYSQL_PASSWORD: ease
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci", "--log-bin-trust-function-creators=1"]
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://ease:ease@mysql:3306/easecoding?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-deploying}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: mysql+pymysql://ease:ease@mysql:3306/easecoding?charset=utf8mb4
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-300}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  mysql_data:
