services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: easecoding
      MYSQL_USER: ease
      MYSQL_PASSWORD: ease
      MYSQL_ROOT_PASSWORD: local-root-password
      TZ: UTC
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://ease:ease@mysql:3306/easecoding?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-before-deploying}
      JWT_EXPIRY_MINUTES: ${JWT_EXPIRY_MINUTES:-60}
      ENABLE_DEV_ENDPOINTS: ${ENABLE_DEV_ENDPOINTS:-false}
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
